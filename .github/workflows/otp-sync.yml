name: Sync OTP sales → Supabase

# Reads the "Polar project" sheet and upserts qualifying OTP sales as verified
# entries. Runs once a day (07:00 SAST) and on demand.
on:
  schedule:
    - cron: '0 5 * * *'          # once a day (05:00 UTC ≈ 07:00 SAST)
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you triggering a manual OTP sync?'
        required: false
        default: 'on demand'

concurrency:
  group: otp-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        working-directory: scripts
        run: pip install -r requirements.txt
      - name: Run OTP sync
        working-directory: scripts
        env:
          SUPABASE_URL:         https://dqszbqiimbfvmmnpgpsb.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GCP_SA_JSON:          ${{ secrets.GCP_SA_JSON }}
        run: python3 otp_sync.py
